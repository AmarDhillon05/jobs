[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-job-monitor"
version = "0.1.0"
description = "Local-first, AWS-ready monitor for newly posted technical internships"
requires-python = ">=3.11"
# Runtime dependencies are intentionally EMPTY: the backend uses only the Python
# standard library plus boto3/botocore/urllib3, all of which are already present
# in the AWS Lambda Python runtime. This keeps the Lambda asset to `src/` with no
# bundling step (and therefore no Docker requirement for `cdk synth`).
dependencies = []

[project.optional-dependencies]
dev = [
  "boto3>=1.34",
  "moto[all]>=5.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "aws-cdk-lib>=2.150",
  "constructs>=10",
  "cfn-lint>=1.0",
]

[project.scripts]
jobmon = "jobmonitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "infrastructure/tests"]
pythonpath = ["src", "infrastructure"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pure unit tests, no I/O",
  "scrapers: provider/scraper parsing and transport tests",
  "integration: backend pipeline integration tests (moto / in-memory AWS)",
  "aws_local: requires a running LocalStack endpoint",
  "e2e: full end-to-end acceptance scenarios",
  "infra: CDK synthesis / template assertion tests",
  "live: hits real public third-party endpoints (opt-in, never a completion gate)",
]
filterwarnings = [
  "ignore::DeprecationWarning:botocore.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "infrastructure", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",   # function call in default arg (used for injected clocks/factories)
  "SIM108", # ternary rewrites hurt readability in parsers
  "RUF012", # ClassVar annotations not required for simple constant tuples
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# The en/em dashes in the alias-splitting regex are intentional: real company
# names in the seed data use them.
"src/jobmonitor/discovery.py" = ["RUF001"]
# Unicode dashes / no-break spaces are the *subject* of these modules' regexes
# and test cases, not typos.
"src/jobmonitor/identity.py" = ["RUF001"]
"tests/unit/test_job_model.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["jobmonitor"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/jobmonitor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
